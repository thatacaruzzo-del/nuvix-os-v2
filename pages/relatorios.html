.rel-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:20px;border:1.5px solid var(--line);background:#fff;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s;user-select:none}
.rel-chip:hover{border-color:var(--p3);color:var(--p)}
.rel-chip.active{background:var(--p-light);border-color:var(--p);color:var(--p2)}
.rel-chip-check{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff;transition:all .15s}
.rel-chip.active .rel-chip-check{background:var(--p);border-color:var(--p)}
.rel-chip-check svg{width:11px;height:11px;stroke:#fff;stroke-width:3;opacity:0;transform:scale(.6);transition:all .15s}
.rel-chip.active .rel-chip-check svg{opacity:1;transform:scale(1)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}

<script>
function $(id){return document.getElementById(id)}
function val(id){const e=$(id);return e?e.value:''}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function fmtData(d){if(!d)return'—';const p=String(d).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d}
function dataLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hoje(){return dataLocal(new Date())}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setHTML(id,h){const e=$(id);if(e)e.innerHTML=h}
function toast(t,tp){document.querySelector('.nx-toast')?.remove();const el=document.createElement('div');el.className='nx-toast '+(tp||'ok');el.textContent=t;document.body.appendChild(el);setTimeout(()=>{el.style.opacity='0'},3000);setTimeout(()=>el.remove(),3400)}
function initials(n){if(!n)return'?';return n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase()}
async function exportXLSX(data,fn){
  if(!data?.length){toast('Nada para exportar.','err');return}
  const cols=Object.keys(data[0]);
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet('Relatório');
  ws.columns=cols.map(c=>({header:c,key:c,width:Math.max(12,Math.min(40,c.length+4))}));
  ws.getRow(1).eachCell(cell=>{
    cell.font={bold:true,color:{argb:'FFFFFFFF'}};
    cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF6343A4'}};
  });
  data.forEach(r=>ws.addRow(r));
  const buf=await wb.xlsx.writeBuffer();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download=fn+'_'+hoje()+'.xlsx';
  a.click();
}

const SB='https://quullcxptbiqycyakzlc.supabase.co';
const KEY='sb_publishable_hHub8WOjVFPavMPjmfGIBA_kDyvO1s6';
function tokenAtual(){try{return JSON.parse(sessionStorage.getItem('nuvix_v2_session')||'null')?.access_token||null;}catch(e){return null;}}
const H={'apikey':KEY,get 'Authorization'(){return 'Bearer '+(tokenAtual()||KEY);},'Content-Type':'application/json'};
function traduzErroGenerico(textoBruto){let m=String(textoBruto||'');try{const obj=JSON.parse(m);m=obj.message||obj.details||obj.hint||m;}catch(e){}if(/duplicate key|already exists/i.test(m))return'Já existe um registro com essa informação.';if(/violates not-null constraint/i.test(m))return'Preencha todos os campos obrigatórios antes de salvar.';if(/violates foreign key constraint/i.test(m))return'Não é possível concluir — esse registro está vinculado a outro cadastro.';return'Algo deu errado. Tente novamente — se continuar, entre em contato com o suporte.';}
const db={get:async(t,q)=>{let r;try{r=await fetch(`${SB}/rest/v1/${t}${q||''}`,{headers:H});}catch(e){throw new Error('Sem conexão com a internet. Verifique sua rede e tente de novo.');}if(!r.ok)throw new Error(traduzErroGenerico(await r.text()));return r.json()}};
const SESSION_KEY='nuvix_v2_session';
function getSession(){try{const raw=sessionStorage.getItem(SESSION_KEY);if(!raw)return null;const d=JSON.parse(raw);if(Date.now()-d.loginAt>8*60*60*1000){sessionStorage.removeItem(SESSION_KEY);return null}return{...d.user,empresa_id:d.empresa?.id,empresa:d.empresa}}catch{return null}}
function logout(){sessionStorage.removeItem(SESSION_KEY);window.location.href='../index.html'}
function requireAuth(){const s=getSession();if(!s){window.location.href='../index.html';return null}return s}
function temPermissao(modulo,tipo){const s=getSession();if(!s)return false;if(s.perfil==='Administrador'||s.perfil==='SuperAdmin')return true;const p=(s.usuario_permissoes||[]).find(x=>x.modulo===modulo);return p?!!p[`pode_${tipo}`]:true;}
function guardModulo(modulo,fallback){if(!temPermissao(modulo,'ver')){toast('Sem permissão para acessar este módulo.','err');setTimeout(()=>location.href=(fallback||'dashboard.html'),1200);return false;}return true;}
</script>

function abrirDetalheConsignador(id){
  const d=_porConsignadorAtual[id];
  if(!d)return;
  const produtosVendidos=Object.entries(d.produtosVendidos).sort((a,b)=>b[1].faturamento-a[1].faturamento);
  const produtosEstoque=Object.entries(d.produtosEstoque).sort((a,b)=>b[1].valor-a[1].valor);
  $('detConsignadorTitulo').textContent=d.nome;
  setHTML('detConsignadorConteudo',`
    <div style="display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap">
      <div style="flex:1;min-width:180px;background:var(--bg);border-radius:12px;padding:14px 16px">
        <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">Já vendido — a repassar (${d.pct}%)</div>
        <div style="font-size:22px;font-weight:900;color:var(--txt)">${money(d.repasseVendido)}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">${d.qtd} itens vendidos no período</div>
      </div>
      <div style="flex:1;min-width:180px;background:var(--p-light);border-radius:12px;padding:14px 16px">
        <div style="font-size:11px;font-weight:700;color:var(--p2);text-transform:uppercase;letter-spacing:.05em">Em estoque — repasse se vender tudo</div>
        <div style="font-size:22px;font-weight:900;color:var(--p2)">${money(d.repassePotencial)}</div>
        <div style="font-size:12px;color:var(--p2);margin-top:2px">${d.qtdEstoque} itens parados agora</div>
      </div>
    </div>

    <h4 style="margin:0 0 10px;font-size:13px">Vendido no período</h4>
    <div class="tablewrap"><table>
      <thead><tr><th>Produto</th><th>Qtd.</th><th>Faturamento</th><th>Valor a repassar</th></tr></thead>
      <tbody>${produtosVendidos.map(([nome,p])=>`<tr><td>${esc(nome)}</td><td>${p.qtd}</td><td>${money(p.faturamento)}</td><td><b>${money(p.faturamento*d.pct/100)}</b></td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;color:var(--muted)">Nada vendido nesse período</td></tr>'}</tbody>
    </table></div>

    <h4 style="margin:18px 0 10px;font-size:13px">Ainda em estoque, não vendido</h4>
    <div class="tablewrap"><table>
      <thead><tr><th>Produto</th><th>Qtd.</th><th>Valor em estoque</th><th>Repasse projetado</th></tr></thead>
      <tbody>${produtosEstoque.map(([nome,p])=>`<tr><td>${esc(nome)}</td><td>${p.qtd}</td><td>${money(p.valor)}</td><td><b>${money(p.valor*d.pct/100)}</b></td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;color:var(--muted)">Sem estoque parado</td></tr>'}</tbody>
    </table></div>
  `);
  abrirModal('modalDetalheConsignador');
}

function fmtVal(k, v){
  if(v===null||v===undefined)return'—';
  if(typeof v==='boolean')return v?'Sim':'Não';
  if(k.includes('valor')||k==='salario'||k==='receita'||k==='custo_frete')return money(v);
  if(k.includes('data')||k==='created_at'||k==='ppe'||k==='validade')return fmtData(v);
  return esc(String(v));
}

let _relDadosBrutos = []; // fetch cru do módulo genérico atual (todas as colunas) — trocar coluna reaproveita sem bater no banco de novo
let relColunasAtivas = {}; // {coluna: true/false} do módulo genérico atual — tudo ligado toda vez que gera um relatório novo

async function gerarRelatorio(){
  const modulo=val('relModulo');
  if(!modulo){toast('Selecione um módulo.','err');return;}
  if(modulo==='vendas'){ await gerarRelatorioVendas(); return; }
  if(modulo==='ponto'){ await gerarRelatorioPonto(); return; }
  const de=val('relDe'), ate=val('relAte');
  const ehFinanceiro = modulo==='financeiro';
  // Financeiro usa vencimento como período do relatório, com data_lancamento como
  // reserva quando não tem vencimento — mesma regra de fallback já usada na tela
  // Financeiro. Achado real: boa parte dos lançamentos não tem vencimento preenchido —
  // filtrando só por vencimento no banco, esses lançamentos sumiam do relatório sempre,
  // não importa qual período fosse escolhido. Por isso busca tudo (sem filtro de data na
  // consulta) e filtra depois, já aplicando o fallback — não dá pra fazer isso só com
  // query string simples no banco.
  let q=`?select=*&empresa_id=eq.${session.empresa_id}&order=${ehFinanceiro?'vencimento':'created_at'}.desc&limit=${ehFinanceiro?5000:500}`;
  if(!ehFinanceiro){
    if(de) q+=`&created_at=gte.${de}`;
    if(ate) q+=`&created_at=lte.${ate}T23:59:59`;
  }
  (FILTROS_MODULO[modulo]||[]).forEach(f=>{
    const v=val('filtro_'+f.campo);
    if(v) q+=`&${f.campo}=eq.${encodeURIComponent(v)}`;
  });

  setHTML('relConteudo','<div style="text-align:center;padding:32px;color:var(--muted)">Carregando...</div>');
  setHTML('relInfo','');
  setHTML('relTotais','');

  try{
    let dados=await db.get(modulo, q);
    if(ehFinanceiro && (de||ate)){
      dados=dados.filter(f=>{
        const campo=String(f.vencimento||f.data_lancamento||'').slice(0,10);
        if(!campo)return false;
        if(de&&campo<de)return false;
        if(ate&&campo>ate)return false;
        return true;
      });
    }
    _relDadosBrutos = dados;
    if(!_relDadosBrutos.length){
      _relDados=[];
      setHTML('relConteudo','<div style="text-align:center;padding:32px;color:var(--muted)">Nenhum registro encontrado.</div>');
      return;
    }
    const cols = COLS_MODULO[modulo] || Object.keys(_relDadosBrutos[0]).filter(k=>!['id','empresa_id'].includes(k));
    _relColsAtuais = cols;
    relColunasAtivas = {}; cols.forEach(c=>relColunasAtivas[c]=true);
    paginaRelGenerico = 1;
    renderRelConteudoGenerico();
  }catch(e){
    toast('Erro: '+e.message,'err');
    setHTML('relConteudo','');
  }
}
// Total do relatório de Financeiro — soma o que já veio filtrado por tipo (se escolhido),
// então mostra Receita/Despesa/Saldo só quando faz sentido pro filtro aplicado.
function renderTotaisFinanceiro(linhas){
  const tipoFiltro=val('filtro_tipo');
  const totalReceita=linhas.filter(f=>f.tipo==='Receita').reduce((a,f)=>a+Number(f.valor||0),0);
  const totalDespesa=linhas.filter(f=>f.tipo==='Despesa').reduce((a,f)=>a+Number(f.valor||0),0);
  const cards=[];
  if(!tipoFiltro||tipoFiltro==='Receita') cards.push({lbl:'Total de entradas',val:money(totalReceita),cor:'var(--green)'});
  if(!tipoFiltro||tipoFiltro==='Despesa') cards.push({lbl:'Total de saídas',val:money(totalDespesa),cor:'var(--red)'});
  if(!tipoFiltro) cards.push({lbl:'Saldo do período',val:money(totalReceita-totalDespesa),cor:'var(--txt)'});
  setHTML('relTotais',`<div style="display:grid;grid-template-columns:repeat(${cards.length},1fr);gap:12px;margin-bottom:16px">${cards.map(c=>
    `<div class="card" style="margin:0;border-left:4px solid ${c.cor}"><div class="metric-label">${c.lbl}</div><div class="metric-value" style="font-size:20px;color:${c.cor}">${c.val}</div></div>`
  ).join('')}</div>`);
}
// Total genérico — módulos com uma coluna de valor clara (OS, orçamento, comercial,
// transporte) ganham um card de soma, sem precisar da lógica de entrada/saída do Financeiro.
function renderTotalGenerico(linhas, coluna){
  const total=linhas.reduce((a,r)=>a+Number(r[coluna]||0),0);
  setHTML('relTotais',`<div style="display:grid;grid-template-columns:1fr;max-width:260px;gap:12px;margin-bottom:16px">
    <div class="card" style="margin:0;border-left:4px solid var(--p)"><div class="metric-label">Total do período</div><div class="metric-value" style="font-size:20px">${money(total)}</div></div>
  </div>`);
}
// Paginado — o relatório genérico busca até 500 registros de uma vez (_relDadosBrutos),
// mas só mostra 20 por vez na tela pra não rolar infinito. _relDados guarda só as colunas
// marcadas nos chips (é o que vai pro CSV) — mesma regra do relatório de Vendas.
let _relColsAtuais = [];
let paginaRelGenerico = 1;
const REL_GENERICO_POR_PAGINA = 20;
function toggleColunaGenerica(col){ relColunasAtivas[col]=!relColunasAtivas[col]; renderRelConteudoGenerico(); }
function renderRelConteudoGenerico(){
  const modulo=val('relModulo');
  const colsDisponiveis = _relColsAtuais;
  const colunasAtivas = colsDisponiveis.filter(c=>relColunasAtivas[c]);

  else setHTML('relTotais','');

  setHTML('relInfo',`<b>${_relDadosBrutos.length}</b> registros encontrados`);

  _relDados = _relDadosBrutos.map(row=>{

  });

  const chipColuna=k=>`<div class="rel-chip${relColunasAtivas[k]?' active':''}" onclick="toggleColunaGenerica('${k}')"><span class="rel-chip-check"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>${esc(LABELS[k]||k)}</div>`;
  const personalizarHTML = `
    <div class="card" style="margin:0 0 20px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:20px">
        <div>
          <h3 style="margin:0 0 4px">Personalizar relatório</h3>
          <p class="muted" style="font-size:12.5px;margin:0">Escolha o que aparece na tela e no CSV exportado.</p>
        </div>
        <button class="btn" onclick="exportarRelatorio()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-2px;display:inline-block;flex-shrink:0"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Exportar Excel</button>
      </div>
      <div class="rel-chip-grupo-lbl">Colunas</div>
      <div class="rel-chips">${colsDisponiveis.map(chipColuna).join('')}</div>
    </div>`;

  const totalPaginas = Math.max(1,Math.ceil(_relDadosBrutos.length/REL_GENERICO_POR_PAGINA));
  if(paginaRelGenerico>totalPaginas) paginaRelGenerico=totalPaginas;
  const inicio=(paginaRelGenerico-1)*REL_GENERICO_POR_PAGINA;
  const pagina=_relDadosBrutos.slice(inicio,inicio+REL_GENERICO_POR_PAGINA);
  const paginacaoHTML = totalPaginas>1 ? `<div style="display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap">${Array.from({length:totalPaginas},(_,i)=>i+1).map(p=>`<button class="btn2" style="padding:6px 12px;min-width:36px${p===paginaRelGenerico?';background:var(--p);color:#fff;border-color:var(--p)':''}" onclick="irParaPaginaRelGenerico(${p})">${p}</button>`).join('')}</div>` : '';
  const tabelaHTML = `
    <div class="card" style="margin:0">
      <div class="tablewrap">

        <tbody>${pagina.map(row=>`<tr>${colunasAtivas.length?colunasAtivas.map(c=>`<td>${fmtVal(c,row[c])}</td>`).join(''):'<td style="text-align:center;color:var(--muted)">Nenhuma coluna selecionada</td>'}</tr>`).join('')}</tbody>
      </table>
      </div>
      ${paginacaoHTML}

  setHTML('relConteudo', personalizarHTML + tabelaHTML);
}
function irParaPaginaRelGenerico(p){ paginaRelGenerico=p; renderRelConteudoGenerico(); }

// ── Relatório de Vendas — só pra Varejo, junta vendas + itens_venda + venda_formas_pagamento.
// Usa data_venda (não created_at) pra respeitar vendas retroativas: elas devem aparecer
// no período a que de fato pertencem, não no dia em que foram digitadas no sistema.
//
// Busca os dados uma vez só (gerarRelatorioVendas) e guarda em _vendasBrutas; alternar
// seção/coluna/página só re-renderiza a partir do cache (renderRelatorioVendas), sem
// bater no banco de novo — sensação instantânea ao personalizar o relatório.
let _vendasBrutas = null;
let _porConsignadorAtual = {};
let paginaVendasRel = 1;
let paginaProdutoRel = 1;
const VENDAS_REL_POR_PAGINA = 20;
let relVendasSecoes = { resumo:true, forma:true, produto:true, consignado:true, detalhe:true };
let relVendasColunas = { data:true, loja:true, vendedor:true, cliente:true, forma:true, subtotal:true, desconto:true, total:true, retroativa:true };
const COLUNAS_VENDAS_LABEL = { data:'Data', loja:'Loja', vendedor:'Vendedor', cliente:'Cliente', forma:'Forma de pagamento', subtotal:'Subtotal', desconto:'Desconto', total:'Total', retroativa:'Retroativa' };

async function gerarRelatorioVendas(){
  const de=val('relDe'), ate=val('relAte');
  if(!de||!ate){toast('Selecione o período.','err');return;}
  setHTML('relConteudo','<div style="text-align:center;padding:32px;color:var(--muted)">Carregando...</div>');
  setHTML('relInfo','');
  try{
    const vendas=await db.get('vendas',`?select=*&empresa_id=eq.${session.empresa_id}&status=eq.Concluída&data_venda=gte.${de}&data_venda=lte.${ate}&order=data_venda.desc`);
    if(!vendas.length){
      _vendasBrutas=null; _relDados=[];
      setHTML('relConteudo','<div style="text-align:center;padding:32px;color:var(--muted)">Nenhuma venda nesse período.</div>');
      return;
    }
    const ids=vendas.map(v=>v.id);
    const [itens,formas,lojas,consignadores,produtosConsignados,estoqueConsignados]=await Promise.all([
      db.get('itens_venda',`?venda_id=in.(${ids.join(',')})&select=venda_id,produto_nome,quantidade,valor_unitario,is_consignado,consignador_id,percentual_repasse_snapshot`),
      db.get('venda_formas_pagamento',`?venda_id=in.(${ids.join(',')})&select=venda_id,forma_pagamento,valor`),
      db.get('lojas',`?empresa_id=eq.${session.empresa_id}&select=id,nome`),
      db.get('consignadores',`?empresa_id=eq.${session.empresa_id}&select=id,nome,percentual_repasse,ativo`).catch(()=>[]),
      // Estoque parado de consignados é independente do período do relatório — é "agora",
      // não "nesse mês" — por isso busca à parte, sem filtro de data.
      db.get('produtos',`?empresa_id=eq.${session.empresa_id}&is_consignado=eq.true&select=id,nome,consignador_id,preco_venda_final`).catch(()=>[]),
      db.get('estoque_por_loja',`?empresa_id=eq.${session.empresa_id}&select=produto_id,quantidade,loja_id`).catch(()=>[]),
    ]);
    const nomeLoja={}; lojas.forEach(l=>{nomeLoja[l.id]=l.nome;});
    const nomeConsignador={}; consignadores.forEach(c=>{nomeConsignador[c.id]=c.nome;});
    _vendasBrutas = { vendas, itens, formas, nomeLoja, nomeConsignador, consignadoresCad:consignadores, produtosConsignados, estoqueConsignados };
    paginaVendasRel = 1;
    renderRelatorioVendas();
  }catch(e){
    toast('Erro: '+e.message,'err');
    setHTML('relConteudo','');
  }
}

function toggleSecaoVendas(chave){ relVendasSecoes[chave]=!relVendasSecoes[chave]; renderRelatorioVendas(); }
function toggleColunaVendas(chave){ relVendasColunas[chave]=!relVendasColunas[chave]; renderRelatorioVendas(); }
function irParaPaginaVendasRel(p){ paginaVendasRel=p; renderRelatorioVendas(); }
function irParaPaginaProdutoRel(p){ paginaProdutoRel=p; renderRelatorioVendas(); }

function renderRelatorioVendas(){
  if(!_vendasBrutas){ setHTML('relConteudo','<div style="text-align:center;padding:32px;color:var(--muted)">Nenhuma venda nesse período.</div>'); return; }
  const { vendas, itens, formas, nomeLoja, nomeConsignador, consignadoresCad, produtosConsignados, estoqueConsignados } = _vendasBrutas;

  const faturamentoTotal=vendas.reduce((a,v)=>a+Number(v.total||0),0);
  const qtdVendas=vendas.length;
  const ticketMedio=qtdVendas?faturamentoTotal/qtdVendas:0;
  const qtdItens=itens.reduce((a,i)=>a+Number(i.quantidade||0),0);

  const porForma={};
  formas.forEach(f=>{ porForma[f.forma_pagamento]=(porForma[f.forma_pagamento]||0)+Number(f.valor||0); });
  const formasOrdenadas=Object.entries(porForma).sort((a,b)=>b[1]-a[1]);
  const CORES_FORMA={'Dinheiro':'#059669','Pix':'#0EA5E9','Cartão Débito':'#8171E8','Cartão Crédito':'#F59E0B'};

  const vendaPorIdRel={}; vendas.forEach(v=>{vendaPorIdRel[v.id]=v;});
  const porProduto={};
  itens.forEach(i=>{
    const nome=i.produto_nome||'—';
    if(!porProduto[nome]) porProduto[nome]={qtd:0,faturamento:0,isConsignado:false,consignadorId:null};
    porProduto[nome].qtd+=Number(i.quantidade||0);
    // Marca o produto como consignado se QUALQUER item vendido dele veio marcado assim —
    // mesma leitura usada no resto do relatório (is_consignado no item, não no cadastro).
    if(i.is_consignado){ porProduto[nome].isConsignado=true; porProduto[nome].consignadorId=i.consignador_id; }
    // Desconta proporcionalmente o desconto da venda — senão um item com desconto (ou
    // 100% grátis) entrava no "Por produto" como se tivesse faturado o valor cheio.
    const venda=vendaPorIdRel[i.venda_id];
    const bruto=Number(i.quantidade||0)*Number(i.valor_unitario||0);
    const subtotalVd=Number(venda?.subtotal||0);
    const fator=venda&&subtotalVd>0?Number(venda.total||0)/subtotalVd:1;
    porProduto[nome].faturamento+=bruto*fator;
  });
  const produtosOrdenados=Object.entries(porProduto).sort((a,b)=>b[1].faturamento-a[1].faturamento);

  // Por consignador — só itens marcados como consignado, agrupados por quem era o
  // consignador NA HORA da venda (consignador_id/percentual_repasse_snapshot gravados no
  // item, não o cadastro atual do produto — se o % mudar depois, vendas antigas não mudam).
  const porConsignador={};
  itens.filter(i=>i.is_consignado&&i.consignador_id).forEach(i=>{
    const id=i.consignador_id;
    if(!porConsignador[id]) porConsignador[id]={nome:nomeConsignador[id]||'—',qtd:0,faturamento:0,percentual:i.percentual_repasse_snapshot,produtos:{}};
    porConsignador[id].qtd+=Number(i.quantidade||0);
    const venda=vendaPorIdRel[i.venda_id];
    const bruto=Number(i.quantidade||0)*Number(i.valor_unitario||0);
    const subtotalVd=Number(venda?.subtotal||0);
    const fator=venda&&subtotalVd>0?Number(venda.total||0)/subtotalVd:1;
    const valorLiquido=bruto*fator;
    porConsignador[id].faturamento+=valorLiquido;
    // Quebra por produto — pra saber, dentro do total a repassar, quais itens
    // especificamente compõem esse valor (não só o agregado por consignador).
    const nomeProd=i.produto_nome||'—';
    if(!porConsignador[id].produtos[nomeProd]) porConsignador[id].produtos[nomeProd]={qtd:0,faturamento:0};
    porConsignador[id].produtos[nomeProd].qtd+=Number(i.quantidade||0);
    porConsignador[id].produtos[nomeProd].faturamento+=valorLiquido;
  });
  // Estoque parado por consignador — produtos consignados que AINDA não venderam.
  // Somado por produto (todas as lojas juntas), no valor de venda atual — é o que
  // ainda falta vender, e por isso o valor a repassar aqui é só uma projeção (o %
  // atual do cadastro, não um snapshot, porque a venda ainda não aconteceu).
  const estoquePorProduto={};
  estoqueConsignados.forEach(e=>{ estoquePorProduto[e.produto_id]=(estoquePorProduto[e.produto_id]||0)+Number(e.quantidade||0); });
  const estoquePorConsignador={};
  produtosConsignados.filter(p=>p.consignador_id).forEach(p=>{
    const qtd=estoquePorProduto[p.id]||0;
    if(qtd<=0) return;
    const id=p.consignador_id;
    if(!estoquePorConsignador[id]) estoquePorConsignador[id]={qtd:0,valor:0,produtos:{}};
    const valor=qtd*Number(p.preco_venda_final||0);
    estoquePorConsignador[id].qtd+=qtd;
    estoquePorConsignador[id].valor+=valor;
    const nomeProd=p.nome||'—';
    if(!estoquePorConsignador[id].produtos[nomeProd]) estoquePorConsignador[id].produtos[nomeProd]={qtd:0,valor:0};
    estoquePorConsignador[id].produtos[nomeProd].qtd+=qtd;
    estoquePorConsignador[id].produtos[nomeProd].valor+=valor;
  });

  const nomeConsignadorCad={}; const pctConsignadorCad={};
  consignadoresCad.forEach(c=>{ nomeConsignadorCad[c.id]=c.nome; pctConsignadorCad[c.id]=c.percentual_repasse; });
  // União: um consignador entra na lista se vendeu no período OU tem estoque parado
  // agora — hoje quem só tem estoque parado (nenhuma venda) nem aparecia no relatório.
  const idsConsignador=new Set([...Object.keys(porConsignador),...Object.keys(estoquePorConsignador)]);
  const consignadoresOrdenados=[...idsConsignador].map(id=>{
    const vend=porConsignador[id];
    const est=estoquePorConsignador[id];
    const pct=Number(vend?.percentual ?? pctConsignadorCad[id] ?? 0);
    const faturamento=vend?.faturamento||0;
    const qtdEstoque=est?.qtd||0;
    const valorEstoque=est?.valor||0;
    return [id,{
      nome: nomeConsignadorCad[id]||nomeConsignador[id]||'—',
      pct, qtd:vend?.qtd||0, faturamento, repasseVendido:faturamento*pct/100,
      qtdEstoque, valorEstoque, repassePotencial:valorEstoque*pct/100,
      produtosVendidos: vend?.produtos||{}, produtosEstoque: est?.produtos||{},
    }];
  }).sort((a,b)=>(b[1].repasseVendido+b[1].repassePotencial)-(a[1].repasseVendido+a[1].repassePotencial));
  _porConsignadorAtual=Object.fromEntries(consignadoresOrdenados);

  const formasPorVenda={};
  formas.forEach(f=>{ (formasPorVenda[f.venda_id]=formasPorVenda[f.venda_id]||[]).push(f.forma_pagamento); });

  setHTML('relInfo',`<b>${qtdVendas}</b> vendas encontradas no período`);

  const colunasAtivas=Object.keys(relVendasColunas).filter(c=>relVendasColunas[c]);
  const valorLinha={
    data:v=>fmtData(v.data_venda), loja:v=>nomeLoja[v.loja_id]||'—', vendedor:v=>v.vendedor_nome||'—', cliente:v=>v.cliente_nome||'—',
    forma:v=>(formasPorVenda[v.id]||[]).join(' + ')||'—', subtotal:v=>v.subtotal, desconto:v=>v.desconto_total,

  };
  // Exporta exatamente as colunas marcadas — é o que "o cliente selecionou que quer no relatório".
  _relDados = vendas.map(v=>{
    const row={};
    colunasAtivas.forEach(c=>{ row[COLUNAS_VENDAS_LABEL[c]] = valorLinha[c](v); });

  });

  const chipSecao=(k,lbl)=>`<div class="rel-chip${relVendasSecoes[k]?' active':''}" onclick="toggleSecaoVendas('${k}')"><span class="rel-chip-check"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>${lbl}</div>`;
  const chipColuna=(k,lbl)=>`<div class="rel-chip${relVendasColunas[k]?' active':''}" onclick="toggleColunaVendas('${k}')"><span class="rel-chip-check"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>${lbl}</div>`;
  const personalizarHTML=`
    <div class="card" style="margin:0 0 20px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:20px">
        <div>
          <h3 style="margin:0 0 4px">Personalizar relatório</h3>
          <p class="muted" style="font-size:12.5px;margin:0">Escolha o que aparece na tela e no CSV exportado.</p>
        </div>
        <button class="btn" onclick="exportarRelatorio()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-2px;display:inline-block;flex-shrink:0"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Exportar Excel</button>
      </div>
      <div style="display:flex;gap:36px;flex-wrap:wrap">

    </div>`;

  const kpisHTML = relVendasSecoes.resumo ? `
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">
      <div class="card" style="margin:0;border-left:4px solid var(--p)"><div class="metric-label">Faturamento</div><div class="metric-value" style="font-size:20px">${money(faturamentoTotal)}</div></div>

    </div>` : '';

  const formaHTML = relVendasSecoes.forma ? `
    <div class="card" style="margin:0 0 20px">
      <h3 style="margin-bottom:16px">Por forma de pagamento</h3>
      ${formasOrdenadas.length?formasOrdenadas.map(([forma,valor])=>{
        const pct=faturamentoTotal?(valor/faturamentoTotal)*100:0;
        const cor=CORES_FORMA[forma]||'var(--p)';
        return `<div style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span style="font-weight:600">${esc(forma)}</span><span>${money(valor)} · <b>${pct.toFixed(1)}%</b></span></div>
          <div style="background:#F1EFF7;border-radius:8px;height:10px;overflow:hidden"><div style="width:${pct}%;background:${cor};height:100%;border-radius:8px"></div></div>
        </div>`;

  let produtoHTML = '';
  if(relVendasSecoes.produto){
    const totalPaginasProduto=Math.max(1,Math.ceil(produtosOrdenados.length/VENDAS_REL_POR_PAGINA));
    if(paginaProdutoRel>totalPaginasProduto)paginaProdutoRel=totalPaginasProduto;
    const inicioProduto=(paginaProdutoRel-1)*VENDAS_REL_POR_PAGINA;
    const paginaProdutos=produtosOrdenados.slice(inicioProduto,inicioProduto+VENDAS_REL_POR_PAGINA);
    const paginacaoProdutoHTML = totalPaginasProduto>1 ? `<div style="display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap">${Array.from({length:totalPaginasProduto},(_,i)=>i+1).map(p=>`<button class="btn2" style="padding:6px 12px;min-width:36px${p===paginaProdutoRel?';background:var(--p);color:#fff;border-color:var(--p)':''}" onclick="irParaPaginaProdutoRel(${p})">${p}</button>`).join('')}</div>` : '';
    // Cache separado do _relDados (que é sempre a lista de vendas) — pra exportar

    _relDadosPorProduto = produtosOrdenados.map(([nome,d])=>({

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">

      </div>
      <div class="tablewrap"><table>
        <thead><tr><th>Produto</th><th>Qtd.</th><th>Faturamento</th><th>% do total</th></tr></thead>
        <tbody>${paginaProdutos.map(([nome,d])=>`<tr><td>${esc(nome)}${d.isConsignado?` <span class="badge badge-amber" title="${esc(nomeConsignador[d.consignadorId]||'')}">Consignado</span>`:''}</td><td>${d.qtd}</td><td>${money(d.faturamento)}</td><td>${faturamentoTotal?((d.faturamento/faturamentoTotal)*100).toFixed(1):'0'}%</td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;color:var(--muted)">Sem dados</td></tr>'}</tbody>
      </table></div>
      ${paginacaoProdutoHTML}
    </div>`;
  }

  let consignadoHTML = '';
  if(relVendasSecoes.consignado){
    const totalRepasseVendido=consignadoresOrdenados.reduce((a,[,d])=>a+d.repasseVendido,0);
    const totalRepassePotencial=consignadoresOrdenados.reduce((a,[,d])=>a+d.repassePotencial,0);
    consignadoHTML = `
    <div class="card" style="margin:0 0 20px">
      <h3 style="margin-bottom:12px">Por consignador <span style="font-weight:400;color:var(--muted);font-size:13px">(${consignadoresOrdenados.length})</span></h3>
      <p class="muted" style="font-size:12px;margin:0 0 10px">Clique num consignador pra ver o detalhe por produto — o que já vendeu e o que ainda está parado no estoque. <b>Vendido</b> respeita o período selecionado; <b>Em estoque</b> é sempre a posição de hoje.</p>
      <div class="tablewrap"><table>
        <thead><tr><th>Consignador</th><th>% repasse</th><th>Vendido no período</th><th>A repassar (vendido)</th><th>Em estoque</th><th>Repasse se vender tudo</th></tr></thead>
        <tbody>${consignadoresOrdenados.map(([id,d])=>{
          return `<tr style="cursor:pointer" onclick="abrirDetalheConsignador('${id}')">
            <td>${esc(d.nome)}</td>
            <td>${d.pct}%</td>
            <td>${d.qtd} ${d.qtd===1?'item':'itens'} · ${money(d.faturamento)}</td>
            <td><b>${money(d.repasseVendido)}</b></td>
            <td>${d.qtdEstoque?`${d.qtdEstoque} ${d.qtdEstoque===1?'item':'itens'} · ${money(d.valorEstoque)}`:'<span class="muted">Sem estoque parado</span>'}</td>
            <td>${d.qtdEstoque?money(d.repassePotencial):'—'}</td>
          </tr>`;
        }).join('')||'<tr><td colspan="6" style="text-align:center;color:var(--muted)">Nenhum consignador com venda ou estoque nesse período</td></tr>'}</tbody>
      </table></div>
      ${consignadoresOrdenados.length?`<div style="margin-top:14px;display:flex;justify-content:flex-end;gap:24px;flex-wrap:wrap">
        <div style="text-align:right"><div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em">Já vendido, a repassar</div><div style="font-size:16px;font-weight:800">${money(totalRepasseVendido)}</div></div>
        <div style="text-align:right"><div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em">Ainda em estoque (potencial)</div><div style="font-size:16px;font-weight:800;color:var(--p)">${money(totalRepassePotencial)}</div></div>
      </div>`:''}
    </div>`;
  }

  let detalheHTML = '';
  if(relVendasSecoes.detalhe){
    const totalPaginas=Math.max(1,Math.ceil(vendas.length/VENDAS_REL_POR_PAGINA));
    if(paginaVendasRel>totalPaginas) paginaVendasRel=totalPaginas;
    const inicio=(paginaVendasRel-1)*VENDAS_REL_POR_PAGINA;
    const paginaVendas=vendas.slice(inicio,inicio+VENDAS_REL_POR_PAGINA);
    const FMT_COL={ data:v=>fmtData(v.data_venda), loja:v=>esc(nomeLoja[v.loja_id]||'—'), vendedor:v=>esc(v.vendedor_nome||'—'), cliente:v=>esc(v.cliente_nome||'—'),
      forma:v=>esc((formasPorVenda[v.id]||[]).join(' + ')||'—'), subtotal:v=>money(v.subtotal), desconto:v=>money(v.desconto_total),
      total:v=>`<b>${money(v.total)}</b>`, retroativa:v=>v.retroativa?'<span class="badge badge-blue">Sim</span>':'—' };
    const paginacaoHTML = totalPaginas>1 ? `<div style="display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap">${
      Array.from({length:totalPaginas},(_,i)=>i+1).map(p=>`<button class="btn2" style="padding:6px 12px;min-width:36px${p===paginaVendasRel?';background:var(--p);color:#fff;border-color:var(--p)':''}" onclick="irParaPaginaVendasRel(${p})">${p}</button>`).join('')
    }</div>` : '';
    detalheHTML = `
      <div class="card" style="margin:0">
        <h3 style="margin-bottom:12px">Vendas do período <span style="font-weight:400;color:var(--muted);font-size:13px">(${vendas.length})</span></h3>
        <div class="tablewrap"><table>
          <thead><tr>${colunasAtivas.map(c=>`<th>${COLUNAS_VENDAS_LABEL[c]}</th>`).join('')||'<th>—</th>'}</tr></thead>
          <tbody>${paginaVendas.map(v=>`<tr>${colunasAtivas.length?colunasAtivas.map(c=>`<td>${FMT_COL[c](v)}</td>`).join(''):'<td style="text-align:center;color:var(--muted)">Nenhuma coluna selecionada</td>'}</tr>`).join('')}</tbody>
        </table></div>
        ${paginacaoHTML}

  setHTML('relConteudo', personalizarHTML + kpisHTML + formaHTML + produtoHTML + consignadoHTML + detalheHTML);

// ── Relatório de Ponto — usa a coluna `data` (dia trabalhado), não created_at, pelo
// mesmo motivo de Vendas usar data_venda: ponto pode ser lançado/corrigido depois.
// horas_trabalhadas e horas_extras já vêm calculadas e gravadas por salvarPonto() em
// rh.html — aqui só SOMA essas colunas, nunca recalcula a partir de entrada/saída.
let _pontoBrutos = null;
let paginaPontoDetalheRel = 1, paginaPontoResumoRel = 1;
const PONTO_REL_POR_PAGINA = 20;
let relPontoSecoes = { resumo:true, porColaborador:true, detalhe:true };
let relPontoColunasDetalhe = { colaborador:true, data:true, entrada:true, saida:true, horas:true, he:true, tipo:true };
const PONTO_COLUNAS_DETALHE_LABEL = { colaborador:'Colaborador', data:'Data', entrada:'Entrada', saida:'Saída', horas:'Horas trabalhadas', he:'Horas extras', tipo:'Tipo' };
let relPontoBuscaColaborador = '';

async function gerarRelatorioPonto(){
  const de=val('relDe'), ate=val('relAte');
  if(!de||!ate){toast('Selecione o período.','err');return;}
  setHTML('relConteudo','<div style="text-align:center;padding:32px;color:var(--muted)">Carregando...</div>');
  setHTML('relInfo','');
  try{
    const registros=await db.get('ponto',`?select=*&empresa_id=eq.${session.empresa_id}&data=gte.${de}&data=lte.${ate}&order=data.desc`);
    if(!registros.length){
      _pontoBrutos=null; _relDados=[];
      setHTML('relConteudo','<div style="text-align:center;padding:32px;color:var(--muted)">Nenhum registro de ponto nesse período.</div>');
      return;
    }
    _pontoBrutos = { registros };
    paginaPontoDetalheRel=1; paginaPontoResumoRel=1; relPontoBuscaColaborador='';
    renderRelatorioPonto();
  }catch(e){
    toast('Erro: '+e.message,'err');
    setHTML('relConteudo','');
  }
}

function toggleSecaoPonto(chave){ relPontoSecoes[chave]=!relPontoSecoes[chave]; renderRelatorioPonto(); }
function toggleColunaPontoDetalhe(chave){ relPontoColunasDetalhe[chave]=!relPontoColunasDetalhe[chave]; renderRelatorioPonto(); }
function irParaPaginaPontoDetalheRel(p){ paginaPontoDetalheRel=p; renderRelatorioPonto(); }
function irParaPaginaPontoResumoRel(p){ paginaPontoResumoRel=p; renderRelatorioPonto(); }
function filtrarPontoColaborador(v){ relPontoBuscaColaborador=v; paginaPontoDetalheRel=1; paginaPontoResumoRel=1; renderRelatorioPonto(); }

function renderRelatorioPonto(){
  if(!_pontoBrutos){ setHTML('relConteudo','<div style="text-align:center;padding:32px;color:var(--muted)">Nenhum registro de ponto nesse período.</div>'); return; }
  const { registros } = _pontoBrutos;

  const busca=relPontoBuscaColaborador.toLowerCase();
  const lista = busca ? registros.filter(r=>(r.colaborador_nome||'').toLowerCase().includes(busca)) : registros;

  const colaboradoresComRegistro=new Set(lista.map(r=>r.colaborador_id)).size;
  const totalHoras=lista.reduce((a,r)=>a+Number(r.horas_trabalhadas||0),0);
  const totalHE=lista.reduce((a,r)=>a+Number(r.horas_extras||0),0);
  // Mesma definição de "Faltas" já usada em renderPonto() no rh.html (só tipo==='Falta',
  // sem misturar com 'Falta justificada') — mantém os números comparáveis entre as telas.
  const totalFaltas=lista.filter(r=>r.tipo==='Falta').length;

  const porColaborador={};
  lista.forEach(r=>{
    const id=r.colaborador_id||r.colaborador_nome;
    if(!porColaborador[id]) porColaborador[id]={nome:r.colaborador_nome||'—',dias:0,horas:0,he:0,faltas:0,faltasJustificadas:0,atestados:0};
    const c=porColaborador[id];
    c.dias++;
    c.horas+=Number(r.horas_trabalhadas||0);
    c.he+=Number(r.horas_extras||0);
    if(r.tipo==='Falta') c.faltas++;
    if(r.tipo==='Falta justificada') c.faltasJustificadas++;
    if(r.tipo==='Atestado') c.atestados++;
  });
  const porColaboradorOrdenado=Object.entries(porColaborador).sort((a,b)=>a[1].nome.localeCompare(b[1].nome,'pt-BR'));

  setHTML('relInfo',`<b>${lista.length}</b> registros de ponto encontrados`);

  // Exporta sempre o detalhe (uma linha por registro), nunca o resumo por colaborador —
  // mesma regra de Vendas, só respeitando as colunas ligadas.
  const colunasAtivas=Object.keys(relPontoColunasDetalhe).filter(c=>relPontoColunasDetalhe[c]);
  const valorLinha={
    colaborador:r=>r.colaborador_nome||'—', data:r=>fmtData(r.data), entrada:r=>r.entrada||'—', saida:r=>r.saida||'—',
    horas:r=>r.horas_trabalhadas, he:r=>r.horas_extras, tipo:r=>r.tipo||'Normal',
  };
  _relDados = lista.map(r=>{
    const row={};
    colunasAtivas.forEach(c=>{ row[PONTO_COLUNAS_DETALHE_LABEL[c]] = valorLinha[c](r); });
    return row;
  });

  const chipSecao=(k,lbl)=>`<div class="rel-chip${relPontoSecoes[k]?' active':''}" onclick="toggleSecaoPonto('${k}')"><span class="rel-chip-check"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>${lbl}</div>`;
  const chipColuna=(k,lbl)=>`<div class="rel-chip${relPontoColunasDetalhe[k]?' active':''}" onclick="toggleColunaPontoDetalhe('${k}')"><span class="rel-chip-check"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>${lbl}</div>`;
  const personalizarHTML=`
    <div class="card" style="margin:0 0 20px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:20px">
        <div>
          <h3 style="margin:0 0 4px">Personalizar relatório</h3>
          <p class="muted" style="font-size:12.5px;margin:0">Escolha o que aparece na tela e no CSV exportado.</p>
        </div>
        <button class="btn" onclick="exportarRelatorio()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-2px;display:inline-block;flex-shrink:0"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Exportar Excel</button>
      </div>
      <div style="display:flex;gap:36px;flex-wrap:wrap;margin-bottom:16px">
        <div style="flex:1;min-width:220px">
          <div class="rel-chip-grupo-lbl">Seções</div>
          <div class="rel-chips">
            ${Object.entries({resumo:'Resumo',porColaborador:'Por colaborador',detalhe:'Detalhe'}).map(([k,lbl])=>chipSecao(k,lbl)).join('')}
          </div>
        </div>
        <div style="flex:2;min-width:320px">
          <div class="rel-chip-grupo-lbl">Colunas do detalhe</div>
          <div class="rel-chips">
            ${Object.entries(PONTO_COLUNAS_DETALHE_LABEL).map(([k,lbl])=>chipColuna(k,lbl)).join('')}
          </div>
        </div>
      </div>
      <div class="field" style="margin:0;max-width:260px">
        <label>Buscar colaborador</label>
        <input type="text" placeholder="Buscar colaborador..." value="${esc(relPontoBuscaColaborador)}" oninput="filtrarPontoColaborador(this.value)">
      </div>
    </div>`;

  const kpisHTML = relPontoSecoes.resumo ? `
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">
      <div class="card" style="margin:0;border-left:4px solid var(--p)"><div class="metric-label">Colaboradores com registro</div><div class="metric-value" style="font-size:20px">${colaboradoresComRegistro}</div></div>
      <div class="card" style="margin:0;border-left:4px solid var(--p)"><div class="metric-label">Horas trabalhadas</div><div class="metric-value" style="font-size:20px">${totalHoras.toFixed(1)}h</div></div>
      <div class="card" style="margin:0;border-left:4px solid var(--p)"><div class="metric-label">Horas extras</div><div class="metric-value" style="font-size:20px">${totalHE.toFixed(1)}h</div></div>
      <div class="card" style="margin:0;border-left:4px solid ${totalFaltas>0?'var(--red)':'var(--p)'}"><div class="metric-label">Faltas</div><div class="metric-value" style="font-size:20px;color:${totalFaltas>0?'var(--red)':'var(--txt)'}">${totalFaltas}</div></div>
    </div>` : '';

  let porColaboradorHTML='';
  if(relPontoSecoes.porColaborador){
    const totalPaginasResumo=Math.max(1,Math.ceil(porColaboradorOrdenado.length/PONTO_REL_POR_PAGINA));
    if(paginaPontoResumoRel>totalPaginasResumo) paginaPontoResumoRel=totalPaginasResumo;
    const inicioResumo=(paginaPontoResumoRel-1)*PONTO_REL_POR_PAGINA;
    const paginaResumo=porColaboradorOrdenado.slice(inicioResumo,inicioResumo+PONTO_REL_POR_PAGINA);
    const paginacaoResumoHTML = totalPaginasResumo>1 ? `<div style="display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap">${Array.from({length:totalPaginasResumo},(_,i)=>i+1).map(p=>`<button class="btn2" style="padding:6px 12px;min-width:36px${p===paginaPontoResumoRel?';background:var(--p);color:#fff;border-color:var(--p)':''}" onclick="irParaPaginaPontoResumoRel(${p})">${p}</button>`).join('')}</div>` : '';
    porColaboradorHTML = `
    <div class="card" style="margin:0 0 20px">
      <h3 style="margin-bottom:12px">Por colaborador <span style="font-weight:400;color:var(--muted);font-size:13px">(${porColaboradorOrdenado.length})</span></h3>
      <div class="tablewrap"><table>
        <thead><tr><th>Colaborador</th><th>Dias registrados</th><th>Horas trabalhadas</th><th>Horas extras</th><th>Faltas</th><th>Faltas justificadas</th><th>Atestados</th></tr></thead>
        <tbody>${paginaResumo.map(([,c])=>`<tr><td><b>${esc(c.nome)}</b></td><td>${c.dias}</td><td>${c.horas.toFixed(1)}h</td><td>${c.he.toFixed(1)}h</td><td>${c.faltas}</td><td>${c.faltasJustificadas}</td><td>${c.atestados}</td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--muted)">Sem dados</td></tr>'}</tbody>
      </table></div>
      ${paginacaoResumoHTML}
    </div>`;
  }

  let detalheHTML='';
  if(relPontoSecoes.detalhe){
    const totalPaginasDetalhe=Math.max(1,Math.ceil(lista.length/PONTO_REL_POR_PAGINA));
    if(paginaPontoDetalheRel>totalPaginasDetalhe) paginaPontoDetalheRel=totalPaginasDetalhe;
    const inicioDetalhe=(paginaPontoDetalheRel-1)*PONTO_REL_POR_PAGINA;
    const paginaDetalhe=lista.slice(inicioDetalhe,inicioDetalhe+PONTO_REL_POR_PAGINA);
    const FMT_COL={ colaborador:r=>esc(r.colaborador_nome||'—'), data:r=>fmtData(r.data), entrada:r=>esc(r.entrada||'—'), saida:r=>esc(r.saida||'—'),
      horas:r=>r.horas_trabalhadas?`<b>${Number(r.horas_trabalhadas).toFixed(1)}h</b>`:'—', he:r=>r.horas_extras?Number(r.horas_extras).toFixed(1)+'h':'—',
      tipo:r=>`<span class="badge ${r.tipo==='Falta'?'badge-red':''}">${esc(r.tipo||'Normal')}</span>` };
    const paginacaoDetalheHTML = totalPaginasDetalhe>1 ? `<div style="display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap">${Array.from({length:totalPaginasDetalhe},(_,i)=>i+1).map(p=>`<button class="btn2" style="padding:6px 12px;min-width:36px${p===paginaPontoDetalheRel?';background:var(--p);color:#fff;border-color:var(--p)':''}" onclick="irParaPaginaPontoDetalheRel(${p})">${p}</button>`).join('')}</div>` : '';
    detalheHTML = `
      <div class="card" style="margin:0">
        <h3 style="margin-bottom:12px">Registros de ponto <span style="font-weight:400;color:var(--muted);font-size:13px">(${lista.length})</span></h3>
        <div class="tablewrap"><table>
          <thead><tr>${colunasAtivas.map(c=>`<th>${PONTO_COLUNAS_DETALHE_LABEL[c]}</th>`).join('')||'<th>—</th>'}</tr></thead>
          <tbody>${paginaDetalhe.map(r=>`<tr>${colunasAtivas.length?colunasAtivas.map(c=>`<td>${FMT_COL[c](r)}</td>`).join(''):'<td style="text-align:center;color:var(--muted)">Nenhuma coluna selecionada</td>'}</tr>`).join('')}</tbody>
        </table></div>
        ${paginacaoDetalheHTML}
      </div>`;
  }

  setHTML('relConteudo', personalizarHTML + kpisHTML + porColaboradorHTML + detalheHTML);
}

function exportarRelatorio(){
  if(!temPermissao('relatorios','exportar')){toast('Sem permissão para exportar.','err');return;}
  if(!_relDados.length){toast('Gere um relatório primeiro.','err');return;}
  exportXLSX(_relDados, val('relModulo')||'relatorio');
}
function exportarPorProduto(){
  if(!temPermissao('relatorios','exportar')){toast('Sem permissão para exportar.','err');return;}
  if(!_relDadosPorProduto.length){toast('Gere um relatório primeiro.','err');return;}
  exportXLSX(_relDadosPorProduto, 'vendas_por_produto');
}

function atualizarColunas(){
  renderFiltrosExtra();
  setHTML('relTotais','');
  setHTML('relConteudo','<div style="text-align:center;padding:32px;color:var(--muted)">Clique em Gerar para carregar os dados.</div>');
}

function init(){
  if(!session)return;
  if(!guardModulo('relatorios'))return;
  $('userName').textContent=session.nome||'';
  $('userAvatar').textContent=initials(session.nome||'');
  const emp=session.empresa;
  if(emp){
    $('topbarSub').textContent=(emp.fantasia||emp.razao||'')+' · Relatórios';
    if(emp.trial_fim){const d=Math.ceil((new Date(emp.trial_fim)-new Date())/864e5);if(d>0){$('trialBadge').textContent='Teste grátis: '+d+' dias';$('trialBadge').style.display='inline-block';}}
  }
  // Set default dates (last 30 days)
  const ate=hoje();
  const de=new Date();de.setDate(de.getDate()-30);
  if($('relDe'))$('relDe').value=dataLocal(de);
  if($('relAte'))$('relAte').value=ate;

  // Quick access cards
  setHTML('relCards',[
    {ico:'🛒',lbl:'Vendas',mod:'vendas',grad:'linear-gradient(150deg,#34D399 0%,#059669 100%)'},
    {ico:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>',lbl:'Financeiro',mod:'financeiro',grad:'linear-gradient(150deg,#9B8CF0 0%,#8171E8 100%)'},
    {ico:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',lbl:'Clientes',mod:'clientes',grad:'linear-gradient(150deg,var(--p) 0%,var(--p2) 100%)'},
    {ico:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></svg>',lbl:'Ordens de Serviço',mod:'ordens_servico',grad:'linear-gradient(150deg,#5B21B6 0%,#3B1178 100%)'},
    {ico:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',lbl:'Materiais',mod:'materiais',grad:'linear-gradient(150deg,#C4B5FD 0%,#D2BCFF 100%)'},
  ].map(c=>`
    <div onclick="document.getElementById('relModulo').value='${c.mod}';atualizarColunas();gerarRelatorio()"
      style="background:${c.grad};border:none;border-radius:20px;padding:24px 20px;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease;text-align:center;box-shadow:0 10px 26px rgba(83,50,148,.25);color:#fff"
      onmouseover="this.style.transform='translateY(-2px)'"
      onmouseout="this.style.transform=''">
      <div style="width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;margin:0 auto 12px">${c.ico}</div>
      <div style="font-size:14px;font-weight:700;color:#fff">${c.lbl}</div>
      <div style="font-size:11px;color:rgba(255,255,255,.72);margin-top:4px">Clique para gerar</div>
    </div>`).join(''));
}

init();
</script>
<script>
// ── Sidebar dinâmica por segmento ──
(function(){
  try{
    const raw = sessionStorage.getItem('nuvix_v2_session');
    if(!raw) return;
    const d = JSON.parse(raw);
    const seg = (d.empresa?.segmento || d.empresa?.tipo || '').toLowerCase();
    const nav = document.getElementById('sidebar');
    if(!nav) return;

    // Ponto x RH — funcionário que só bate ponto (permissão "folha_ponto" liberada
    // e "rh" explicitamente negada) não deve ver "RH" no menu, só "Ponto". Mesma
    // regra "fail-open" do resto do sistema: sem linha de permissão pro módulo,
    // conta como liberado — então por padrão continua mostrando RH normalmente.
    const _perfil = d.user?.perfil;
    const _perms = d.user?.usuario_permissoes || [];
    const temPerm = (mod,tipo) => {
      if(_perfil==='Administrador'||_perfil==='SuperAdmin') return true;
      const p = _perms.find(x=>x.modulo===mod);
      return p ? !!p[`pode_${tipo}`] : true;
    };
    const soPonto = !temPerm('rh','ver') && temPerm('folha_ponto','ver');
    const linkPessoasRH = soPonto
      ? '<a class="sb-btn" href="rh.html" data-tip="Bater ponto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>Ponto</span></a>'
      : '<a class="sb-btn" href="rh.html" data-tip="RH e Colaboradores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg><span>RH</span></a>';

    const logo = nav.querySelector('.sidebar-logo');
    const configBtn = nav.querySelector('[href="parametros.html"]')?.closest('.sb-group');

    // Determine which groups to show
    const isTransporte = seg.includes('transporte');
    const isServico = seg.includes('serviço') || seg.includes('servico') || seg.includes('serviços') || seg.includes('prestação');
    const isVarejo = seg.includes('venda de produto');
    const isMista = seg.includes('mista');

    // Hide all dynamic groups (keep logo and config)
    nav.querySelectorAll('.sb-group').forEach(g => {
      if(!g.style.marginTop) g.style.display = 'none';
    });

    // Build groups based on segment
    let html = '';

    // PRINCIPAL - always
    html += `<div class="sb-group">
      <div class="sb-group-label">Principal</div>
      <a class="sb-btn" href="dashboard.html" data-tip="Painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Painel</span></a>
      <a class="sb-btn" href="financeiro.html" data-tip="Financeiro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>Financeiro</span></a>
      <a class="sb-btn" href="notas-fiscais.html" data-tip="Notas Fiscais"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/></svg><span>Notas Fiscais</span></a>
      <a class="sb-btn" href="crm.html" data-tip="Comercial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span>Comercial</span></a>
    </div>`;

    // SERVIÇOS
    if(isServico || isMista){
      html += `<div class="sb-group">
        <div class="sb-group-label">Serviços</div>
        <a class="sb-btn" href="os.html" data-tip="Ordens de Serviço"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg><span>Ordens de Serviço</span></a>
        <a class="sb-btn" href="servicos.html" data-tip="Serviços e Orçamentos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>Serviços</span></a>
        <a class="sb-btn" href="materiais.html" data-tip="Materiais e Estoque"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg><span>Materiais</span></a>
      </div>`;
    }

    // TRANSPORTE
    if(isTransporte || isMista){
      html += `<div class="sb-group">
        <div class="sb-group-label">Transporte</div>
        <a class="sb-btn" href="transporte.html" data-tip="Operações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg><span>Transporte</span></a>
        <a class="sb-btn" href="cotacao.html" data-tip="Cotação de Frete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span>Cotação</span></a>
      </div>`;
    }

    // VENDA DE PRODUTO — segmento isolado de propósito: não compartilha grupo com
    // Serviços nem Transporte (só se sobrepõe pra "Mista", que faz tudo por natureza).
    if(isVarejo || isMista){
      html += `<div class="sb-group">
        <div class="sb-group-label">Produtos</div>
        <a class="sb-btn" href="produtos.html" data-tip="Produtos e Estoque"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-2px;display:inline-block;flex-shrink:0"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg><span>Produtos</span></a>
        <a class="sb-btn" href="caixa.html" data-tip="Caixa (PDV)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-2px;display:inline-block;flex-shrink:0"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span>Caixa</span></a>
      </div>`;
    }

    // PESSOAS - always
    html += `<div class="sb-group">
      <div class="sb-group-label">Pessoas</div>
      <a class="sb-btn" href="app.html" data-tip="Clientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Clientes</span></a>
      ${linkPessoasRH}
    </div>`;

    // ANÁLISE - always
    html += `<div class="sb-group">
      <div class="sb-group-label">Análise</div>
      <a class="sb-btn" href="relatorios.html" data-tip="Relatórios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Relatórios</span></a>
    </div>`;

    // Insert after logo
    logo.insertAdjacentHTML('afterend', html);

    // Filtro por permissão do funcionário — some da sidebar o módulo que o
    // usuário logado não tem "pode_ver" liberado. Administrador/SuperAdmin
    // sempre vê tudo. Módulo sem permissão configurada ainda fica visível
    // (não trava ninguém por permissão que nunca foi definida).
    const HREF_MODULO={'dashboard.html':'dashboard','financeiro.html':'financeiro','crm.html':'crm','transporte.html':'transporte','cotacao.html':'cotacao','rh.html':['rh','folha_ponto'],'relatorios.html':'relatorios','parametros.html':'configuracoes','os.html':'ordens_servico','servicos.html':'servicos','materiais.html':'materiais','notas-fiscais.html':'notas_fiscais','produtos.html':'produtos','caixa.html':'caixa'};
    const permsUser = d.user?.usuario_permissoes || [];
    const isAdminUser = d.user?.perfil==='Administrador' || d.user?.perfil==='SuperAdmin';
    function podeVerModulo(modId){
      if(isAdminUser) return true;
      const ids = Array.isArray(modId)?modId:[modId];
      return ids.some(id=>{const p=permsUser.find(x=>x.modulo===id);return p?!!p.pode_ver:true;});
    }
    nav.querySelectorAll('.sb-btn').forEach(btn=>{
      const modId = HREF_MODULO[btn.getAttribute('href')];
      if(modId && !podeVerModulo(modId)) btn.remove();
    });
    nav.querySelectorAll('.sb-group').forEach(g=>{
      if(g.style.marginTop) return;
      if(!g.querySelector('.sb-btn')) g.remove();
    });

    // Mark active page
    const current = window.location.pathname.split('/').pop();
    nav.querySelectorAll('.sb-btn').forEach(btn => {
      if(btn.getAttribute('href') === current){
        btn.classList.add('active');
      }
    });

  }catch(e){ console.warn('Sidebar error:', e); }
})();
</script>
