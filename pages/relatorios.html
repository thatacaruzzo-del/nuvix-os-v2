<body>
<script>
function $(id){return document.getElementById(id)}
function val(id){const e=$(id);return e?e.value:''}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function fmtData(d){if(!d)return'—';const p=String(d).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d}
function dataLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hoje(){return dataLocal(new Date())}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setHTML(id,h){const e=$(id);if(e)e.innerHTML=h}
function toast(t,tp){document.querySelector('.nx-toast')?.remove();const el=document.createElement('div');el.className='nx-toast '+(tp||'ok');el.textContent=t;document.body.appendChild(el);setTimeout(()=>{el.style.opacity='0'},3000);setTimeout(()=>el.remove(),3400)}
function initials(n){if(!n)return'?';return n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase()}
function exportCSV(data,fn){if(!data?.length){toast('Nada para exportar.','err');return}const cols=Object.keys(data[0]);const csv=[cols.join(','),...data.map(r=>cols.map(c=>`"${String(r[c]??'').replace(/"/g,'""')}"`).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=fn+'_'+hoje()+'.csv';a.click()}

const SB='https://quullcxptbiqycyakzlc.supabase.co';
const KEY='sb_publishable_hHub8WOjVFPavMPjmfGIBA_kDyvO1s6';
function tokenAtual(){try{return JSON.parse(sessionStorage.getItem('nuvix_v2_session')||'null')?.access_token||null;}catch(e){return null;}}
const H={'apikey':KEY,get 'Authorization'(){return 'Bearer '+(tokenAtual()||KEY);},'Content-Type':'application/json'};
function traduzErroGenerico(textoBruto){let m=String(textoBruto||'');try{const obj=JSON.parse(m);m=obj.message||obj.details||obj.hint||m;}catch(e){}if(/duplicate key|already exists/i.test(m))return'Já existe um registro com essa informação.';if(/violates not-null constraint/i.test(m))return'Preencha todos os campos obrigatórios antes de salvar.';if(/violates foreign key constraint/i.test(m))return'Não é possível concluir — esse registro está vinculado a outro cadastro.';return'Algo deu errado. Tente novamente — se continuar, entre em contato com o suporte.';}
const db={get:async(t,q)=>{let r;try{r=await fetch(`${SB}/rest/v1/${t}${q||''}`,{headers:H});}catch(e){throw new Error('Sem conexão com a internet. Verifique sua rede e tente de novo.');}if(!r.ok)throw new Error(traduzErroGenerico(await r.text()));return r.json()}};
const SESSION_KEY='nuvix_v2_session';
function getSession(){try{const raw=sessionStorage.getItem(SESSION_KEY);if(!raw)return null;const d=JSON.parse(raw);if(Date.now()-d.loginAt>8*60*60*1000){sessionStorage.removeItem(SESSION_KEY);return null}return{...d.user,empresa_id:d.empresa?.id,empresa:d.empresa}}catch{return null}}
function logout(){sessionStorage.removeItem(SESSION_KEY);window.location.href='../index.html'}
function requireAuth(){const s=getSession();if(!s){window.location.href='../index.html';return null}return s}
function temPermissao(modulo,tipo){const s=getSession();if(!s)return false;if(s.perfil==='Administrador'||s.perfil==='SuperAdmin')return true;const p=(s.usuario_permissoes||[]).find(x=>x.modulo===modulo);return p?!!p[`pode_${tipo}`]:true;}
function guardModulo(modulo,fallback){if(!temPermissao(modulo,'ver')){toast('Sem permissão para acessar este módulo.','err');setTimeout(()=>location.href=(fallback||'dashboard.html'),1200);return false;}return true;}
</script>

<script>
function abrirSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebarOverlay').classList.add('open');document.body.style.overflow='hidden'}
function fecharSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('open');document.body.style.overflow=''}

const session = requireAuth();
let _relDados = [];

const COLS_MODULO = {
  financeiro:['tipo','categoria','descricao','valor','data_lancamento','vencimento','data_pagamento','status','forma_pagamento','favorecido','centro_custo'],
  clientes:['nome','email','telefone','cidade','segmento','created_at'],
  colaboradores:['nome','cargo','departamento','tipo_contrato','salario','data_admissao','ativo'],
  transporte:['cliente','origem','destino','status','receita','custo_frete','data_lancamento','ppe'],
  materiais:['codigo','nome','categoria','unidade','estoque_atual','estoque_minimo','custo_compra','valor_venda','status'],
  ordens_servico:['numero','cliente_nome','servico','status','prioridade','tecnico_nome','data_abertura','data_agendada','data_conclusao','valor_total'],
  servicos_orcamentos:['servico_nome','cliente_nome','status','valor_total','data_lancamento','validade'],
  crm_oportunidades:['nome','empresa','status','valor_previsto','responsavel','created_at'],
};

const LABELS = {
  tipo:'Tipo', categoria:'Categoria', descricao:'Descrição', valor:'Valor',
  data_lancamento:'Data', vencimento:'Vencimento', data_pagamento:'Pagamento',
  status:'Status', forma_pagamento:'Forma', favorecido:'Favorecido',
  centro_custo:'Centro custo', nome:'Nome', email:'E-mail', telefone:'Telefone',
  cidade:'Cidade', segmento:'Segmento', created_at:'Criado em',
  cargo:'Cargo', departamento:'Depto', tipo_contrato:'Contrato',
  salario:'Salário', data_admissao:'Admissão', ativo:'Ativo',
  cliente:'Cliente', origem:'Origem', destino:'Destino', receita:'Receita',
  custo_frete:'Custo frete', ppe:'PPE', codigo:'Código',
  unidade:'Unidade', estoque_atual:'Estoque', estoque_minimo:'Mínimo',
  custo_compra:'Custo', valor_venda:'Venda', numero:'Número',
  cliente_nome:'Cliente', servico:'Serviço', prioridade:'Prioridade',
  tecnico_nome:'Técnico', data_abertura:'Abertura', data_agendada:'Agendado',
  data_conclusao:'Conclusão', valor_total:'Total', servico_nome:'Serviço',
  validade:'Validade', empresa:'Empresa', valor_previsto:'Valor previsto',
  responsavel:'Responsável',
};

function fmtVal(k, v){
  if(v===null||v===undefined)return'—';
  if(typeof v==='boolean')return v?'Sim':'Não';
  if(k.includes('valor')||k==='salario'||k==='receita'||k==='custo_frete')return money(v);
  if(k.includes('data')||k==='created_at'||k==='ppe'||k==='validade')return fmtData(v);
  return esc(String(v));
}

async function gerarRelatorio(){
  const modulo=val('relModulo');
  if(!modulo){toast('Selecione um módulo.','err');return;}
  if(modulo==='vendas'){ await gerarRelatorioVendas(); return; }
  const de=val('relDe'), ate=val('relAte');
  // Financeiro usa vencimento como período do relatório (mesmo campo "recomendado" da
  // tela Financeiro) — created_at é só quando o lançamento foi digitado no sistema, não
  // a data que ele representa, e dava relatório com data errada pra quem lançou antecipado
  // ou atrasado.
  const campoData = modulo==='financeiro' ? 'vencimento' : 'created_at';
  let q=`?select=*&empresa_id=eq.${session.empresa_id}&order=${campoData}.desc&limit=500`;
  if(de) q+=`&${campoData}=gte.${de}`;
  if(ate) q+=`&${campoData}=lte.${ate}${campoData==='created_at'?'T23:59:59':''}`;
  if(modulo==='financeiro' && val('relTipo')) q+=`&tipo=eq.${val('relTipo')}`;

  setHTML('relConteudo','<div style="text-align:center;padding:32px;color:var(--muted)">Carregando...</div>');
  setHTML('relInfo','');
  setHTML('relTotais','');

  try{
    _relDados = await db.get(modulo, q);
    if(!_relDados.length){
      setHTML('relConteudo','<div style="text-align:center;padding:32px;color:var(--muted)">Nenhum registro encontrado.</div>');
      return;
    }
    if(modulo==='financeiro') renderTotaisFinanceiro(_relDados);
    const cols = COLS_MODULO[modulo] || Object.keys(_relDados[0]).filter(k=>!['id','empresa_id'].includes(k));
    _relColsAtuais = cols;
    paginaRelGenerico = 1;
    setHTML('relInfo',`<b>${_relDados.length}</b> registros encontrados`);
    renderRelConteudoGenerico();
  }catch(e){
    toast('Erro: '+e.message,'err');
    setHTML('relConteudo','');
  }
}
// Total do relatório de Financeiro — soma o que já veio filtrado por tipo (se escolhido),
// então mostra Receita/Despesa/Saldo só quando faz sentido pro filtro aplicado.
function renderTotaisFinanceiro(linhas){
  const tipoFiltro=val('relTipo');
  const totalReceita=linhas.filter(f=>f.tipo==='Receita').reduce((a,f)=>a+Number(f.valor||0),0);
  const totalDespesa=linhas.filter(f=>f.tipo==='Despesa').reduce((a,f)=>a+Number(f.valor||0),0);
  const cards=[];
  if(!tipoFiltro||tipoFiltro==='Receita') cards.push({lbl:'Total de entradas',val:money(totalReceita),cor:'var(--green)'});
  if(!tipoFiltro||tipoFiltro==='Despesa') cards.push({lbl:'Total de saídas',val:money(totalDespesa),cor:'var(--red)'});
  if(!tipoFiltro) cards.push({lbl:'Saldo do período',val:money(totalReceita-totalDespesa),cor:'var(--txt)'});
  setHTML('relTotais',`<div style="display:grid;grid-template-columns:repeat(${cards.length},1fr);gap:12px;margin-bottom:16px">${cards.map(c=>
    `<div class="card" style="margin:0;border-left:4px solid ${c.cor}"><div class="metric-label">${c.lbl}</div><div class="metric-value" style="font-size:20px;color:${c.cor}">${c.val}</div></div>`
  ).join('')}</div>`);
}
// Paginado — o relatório genérico busca até 500 registros de uma vez (_relDados,
// usado inteiro na exportação), mas só mostra 20 por vez na tela pra não rolar infinito.
let _relColsAtuais = [];
let paginaRelGenerico = 1;
const REL_GENERICO_POR_PAGINA = 20;
function renderRelConteudoGenerico(){
  const cols = _relColsAtuais;
  const totalPaginas = Math.max(1,Math.ceil(_relDados.length/REL_GENERICO_POR_PAGINA));
  if(paginaRelGenerico>totalPaginas) paginaRelGenerico=totalPaginas;
  const inicio=(paginaRelGenerico-1)*REL_GENERICO_POR_PAGINA;
  const pagina=_relDados.slice(inicio,inicio+REL_GENERICO_POR_PAGINA);
  const paginacaoHTML = totalPaginas>1 ? `<div style="display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap">${Array.from({length:totalPaginas},(_,i)=>i+1).map(p=>`<button class="btn2" style="padding:6px 12px;min-width:36px${p===paginaRelGenerico?';background:var(--p);color:#fff;border-color:var(--p)':''}" onclick="irParaPaginaRelGenerico(${p})">${p}</button>`).join('')}</div>` : '';
  setHTML('relConteudo',`
    <table>
      <thead><tr>${cols.map(c=>`<th>${LABELS[c]||c}</th>`).join('')}</tr></thead>
      <tbody>${pagina.map(row=>`<tr>${cols.map(c=>`<td>${fmtVal(c,row[c])}</td>`).join('')}</tr>`).join('')}</tbody>
    </table>${paginacaoHTML}`);
}
function irParaPaginaRelGenerico(p){ paginaRelGenerico=p; renderRelConteudoGenerico(); }

// ── Relatório de Vendas — só pra Varejo, junta vendas + itens_venda + venda_formas_pagamento.
// Usa data_venda (não created_at) pra respeitar vendas retroativas: elas devem aparecer
// no período a que de fato pertencem, não no dia em que foram digitadas no sistema.
//
// Busca os dados uma vez só (gerarRelatorioVendas) e guarda em _vendasBrutas; alternar
// seção/coluna/página só re-renderiza a partir do cache (renderRelatorioVendas), sem
// bater no banco de novo — sensação instantânea ao personalizar o relatório.
let _vendasBrutas = null;
let paginaVendasRel = 1;
let paginaProdutoRel = 1;
const VENDAS_REL_POR_PAGINA = 20;
let relVendasSecoes = { resumo:true, forma:true, produto:true, detalhe:true };
let relVendasColunas = { data:true, loja:true, vendedor:true, cliente:true, forma:true, subtotal:true, desconto:true, total:true, retroativa:true };
const COLUNAS_VENDAS_LABEL = { data:'Data', loja:'Loja', vendedor:'Vendedor', cliente:'Cliente', forma:'Forma de pagamento', subtotal:'Subtotal', desconto:'Desconto', total:'Total', retroativa:'Retroativa' };

async function gerarRelatorioVendas(){
  const de=val('relDe'), ate=val('relAte');
  if(!de||!ate){toast('Selecione o período.','err');return;}
  setHTML('relConteudo','<div style="text-align:center;padding:32px;color:var(--muted)">Carregando...</div>');
  setHTML('relInfo','');
  try{
    const vendas=await db.get('vendas',`?select=*&empresa_id=eq.${session.empresa_id}&status=eq.Concluída&data_venda=gte.${de}&data_venda=lte.${ate}&order=data_venda.desc`);
    if(!vendas.length){
      _vendasBrutas=null; _relDados=[];
      setHTML('relConteudo','<div style="text-align:center;padding:32px;color:var(--muted)">Nenhuma venda nesse período.</div>');
      return;
    }
    const ids=vendas.map(v=>v.id);
    const [itens,formas,lojas]=await Promise.all([
      db.get('itens_venda',`?venda_id=in.(${ids.join(',')})&select=venda_id,produto_nome,quantidade,valor_unitario,is_consignado`),
      db.get('venda_formas_pagamento',`?venda_id=in.(${ids.join(',')})&select=venda_id,forma_pagamento,valor`),
      db.get('lojas',`?empresa_id=eq.${session.empresa_id}&select=id,nome`),
    ]);
    const nomeLoja={}; lojas.forEach(l=>{nomeLoja[l.id]=l.nome;});
    _vendasBrutas = { vendas, itens, formas, nomeLoja };
    paginaVendasRel = 1;
    renderRelatorioVendas();
  }catch(e){
    toast('Erro: '+e.message,'err');
    setHTML('relConteudo','');
  }
}

function toggleSecaoVendas(chave){ relVendasSecoes[chave]=!relVendasSecoes[chave]; renderRelatorioVendas(); }
function toggleColunaVendas(chave){ relVendasColunas[chave]=!relVendasColunas[chave]; renderRelatorioVendas(); }
function irParaPaginaVendasRel(p){ paginaVendasRel=p; renderRelatorioVendas(); }
function irParaPaginaProdutoRel(p){ paginaProdutoRel=p; renderRelatorioVendas(); }

function renderRelatorioVendas(){
  if(!_vendasBrutas){ setHTML('relConteudo','<div style="text-align:center;padding:32px;color:var(--muted)">Nenhuma venda nesse período.</div>'); return; }
  const { vendas, itens, formas, nomeLoja } = _vendasBrutas;

  const faturamentoTotal=vendas.reduce((a,v)=>a+Number(v.total||0),0);
  const qtdVendas=vendas.length;
  const ticketMedio=qtdVendas?faturamentoTotal/qtdVendas:0;
  const qtdItens=itens.reduce((a,i)=>a+Number(i.quantidade||0),0);

  const porForma={};
  formas.forEach(f=>{ porForma[f.forma_pagamento]=(porForma[f.forma_pagamento]||0)+Number(f.valor||0); });
  const formasOrdenadas=Object.entries(porForma).sort((a,b)=>b[1]-a[1]);
  const CORES_FORMA={'Dinheiro':'#059669','Pix':'#0EA5E9','Cartão Débito':'#8171E8','Cartão Crédito':'#F59E0B'};

  const porProduto={};
  itens.forEach(i=>{
    const nome=i.produto_nome||'—';
    if(!porProduto[nome]) porProduto[nome]={qtd:0,faturamento:0};
    porProduto[nome].qtd+=Number(i.quantidade||0);
    porProduto[nome].faturamento+=Number(i.quantidade||0)*Number(i.valor_unitario||0);
  });
  const produtosOrdenados=Object.entries(porProduto).sort((a,b)=>b[1].faturamento-a[1].faturamento);

  const formasPorVenda={};
  formas.forEach(f=>{ (formasPorVenda[f.venda_id]=formasPorVenda[f.venda_id]||[]).push(f.forma_pagamento); });

  setHTML('relInfo',`<b>${qtdVendas}</b> vendas encontradas no período`);

  const colunasAtivas=Object.keys(relVendasColunas).filter(c=>relVendasColunas[c]);
  const valorLinha={
    data:v=>fmtData(v.data_venda), loja:v=>nomeLoja[v.loja_id]||'—', vendedor:v=>v.vendedor_nome||'—', cliente:v=>v.cliente_nome||'—',
    forma:v=>(formasPorVenda[v.id]||[]).join(' + ')||'—', subtotal:v=>v.subtotal, desconto:v=>v.desconto_total,
    total:v=>v.total, retroativa:v=>v.retroativa?'Sim':'Não',
  };
  // Exporta exatamente as colunas marcadas — é o que "o cliente selecionou que quer no relatório".
  _relDados = vendas.map(v=>{
    const row={};
    colunasAtivas.forEach(c=>{ row[COLUNAS_VENDAS_LABEL[c]] = valorLinha[c](v); });
    return row;
  });

  const personalizarHTML=`
    <div class="card" style="margin:0 0 20px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:14px">
        <h3 style="margin:0">Personalizar relatório</h3>
        <button class="btn" onclick="exportarRelatorio()">⬇ Exportar CSV</button>
      </div>
      <div style="display:flex;gap:32px;flex-wrap:wrap">
        <div>
          <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Seções</div>
          ${Object.entries({resumo:'Resumo',forma:'Por forma de pagamento',produto:'Por produto',detalhe:'Lista de vendas'}).map(([k,lbl])=>
            `<label style="display:flex;align-items:center;gap:7px;font-size:13px;margin-bottom:7px;cursor:pointer"><input type="checkbox" ${relVendasSecoes[k]?'checked':''} onchange="toggleSecaoVendas('${k}')">${lbl}</label>`
          ).join('')}
        </div>
        <div>
          <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Colunas da lista de vendas</div>
          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:2px 20px">
          ${Object.entries(COLUNAS_VENDAS_LABEL).map(([k,lbl])=>
            `<label style="display:flex;align-items:center;gap:7px;font-size:13px;margin-bottom:7px;cursor:pointer"><input type="checkbox" ${relVendasColunas[k]?'checked':''} onchange="toggleColunaVendas('${k}')">${lbl}</label>`
          ).join('')}
          </div>
        </div>
      </div>
    </div>`;

  const kpisHTML = relVendasSecoes.resumo ? `
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">
      <div class="card" style="margin:0;border-left:4px solid var(--p)"><div class="metric-label">Faturamento</div><div class="metric-value" style="font-size:20px">${money(faturamentoTotal)}</div></div>
      <div class="card" style="margin:0;border-left:4px solid var(--p)"><div class="metric-label">Vendas</div><div class="metric-value" style="font-size:20px">${qtdVendas}</div></div>
      <div class="card" style="margin:0;border-left:4px solid var(--p)"><div class="metric-label">Ticket médio</div><div class="metric-value" style="font-size:20px">${money(ticketMedio)}</div></div>
      <div class="card" style="margin:0;border-left:4px solid var(--p)"><div class="metric-label">Itens vendidos</div><div class="metric-value" style="font-size:20px">${qtdItens}</div></div>
    </div>` : '';

  const formaHTML = relVendasSecoes.forma ? `
    <div class="card" style="margin:0 0 20px">
      <h3 style="margin-bottom:16px">Por forma de pagamento</h3>
      ${formasOrdenadas.length?formasOrdenadas.map(([forma,valor])=>{
        const pct=faturamentoTotal?(valor/faturamentoTotal)*100:0;
        const cor=CORES_FORMA[forma]||'var(--p)';
        return `<div style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span style="font-weight:600">${esc(forma)}</span><span>${money(valor)} · <b>${pct.toFixed(1)}%</b></span></div>
          <div style="background:#F1EFF7;border-radius:8px;height:10px;overflow:hidden"><div style="width:${pct}%;background:${cor};height:100%;border-radius:8px"></div></div>
        </div>`;
      }).join(''):'<div style="text-align:center;color:var(--muted);padding:16px">Sem dados</div>'}
    </div>` : '';

  let produtoHTML = '';
  if(relVendasSecoes.produto){
    const totalPaginasProduto=Math.max(1,Math.ceil(produtosOrdenados.length/VENDAS_REL_POR_PAGINA));
    if(paginaProdutoRel>totalPaginasProduto)paginaProdutoRel=totalPaginasProduto;
    const inicioProduto=(paginaProdutoRel-1)*VENDAS_REL_POR_PAGINA;
    const paginaProdutos=produtosOrdenados.slice(inicioProduto,inicioProduto+VENDAS_REL_POR_PAGINA);
    const paginacaoProdutoHTML = totalPaginasProduto>1 ? `<div style="display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap">${Array.from({length:totalPaginasProduto},(_,i)=>i+1).map(p=>`<button class="btn2" style="padding:6px 12px;min-width:36px${p===paginaProdutoRel?';background:var(--p);color:#fff;border-color:var(--p)':''}" onclick="irParaPaginaProdutoRel(${p})">${p}</button>`).join('')}</div>` : '';
    produtoHTML = `
    <div class="card" style="margin:0 0 20px">
      <h3 style="margin-bottom:12px">Por produto <span style="font-weight:400;color:var(--muted);font-size:13px">(${produtosOrdenados.length})</span></h3>
      <div class="tablewrap"><table>
        <thead><tr><th>Produto</th><th>Qtd.</th><th>Faturamento</th><th>% do total</th></tr></thead>
        <tbody>${paginaProdutos.map(([nome,d])=>`<tr><td>${esc(nome)}</td><td>${d.qtd}</td><td>${money(d.faturamento)}</td><td>${faturamentoTotal?((d.faturamento/faturamentoTotal)*100).toFixed(1):'0'}%</td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;color:var(--muted)">Sem dados</td></tr>'}</tbody>
      </table></div>
      ${paginacaoProdutoHTML}
    </div>`;
  }

  let detalheHTML = '';
  if(relVendasSecoes.detalhe){
    const totalPaginas=Math.max(1,Math.ceil(vendas.length/VENDAS_REL_POR_PAGINA));
    if(paginaVendasRel>totalPaginas) paginaVendasRel=totalPaginas;
    const inicio=(paginaVendasRel-1)*VENDAS_REL_POR_PAGINA;
    const paginaVendas=vendas.slice(inicio,inicio+VENDAS_REL_POR_PAGINA);
    const FMT_COL={ data:v=>fmtData(v.data_venda), loja:v=>esc(nomeLoja[v.loja_id]||'—'), vendedor:v=>esc(v.vendedor_nome||'—'), cliente:v=>esc(v.cliente_nome||'—'),
      forma:v=>esc((formasPorVenda[v.id]||[]).join(' + ')||'—'), subtotal:v=>money(v.subtotal), desconto:v=>money(v.desconto_total),
      total:v=>`<b>${money(v.total)}</b>`, retroativa:v=>v.retroativa?'<span class="badge badge-blue">Sim</span>':'—' };
    const paginacaoHTML = totalPaginas>1 ? `<div style="display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap">${
      Array.from({length:totalPaginas},(_,i)=>i+1).map(p=>`<button class="btn2" style="padding:6px 12px;min-width:36px${p===paginaVendasRel?';background:var(--p);color:#fff;border-color:var(--p)':''}" onclick="irParaPaginaVendasRel(${p})">${p}</button>`).join('')
    }</div>` : '';
    detalheHTML = `
      <div class="card" style="margin:0">
        <h3 style="margin-bottom:12px">Vendas do período <span style="font-weight:400;color:var(--muted);font-size:13px">(${vendas.length})</span></h3>
        <div class="tablewrap"><table>
          <thead><tr>${colunasAtivas.map(c=>`<th>${COLUNAS_VENDAS_LABEL[c]}</th>`).join('')||'<th>—</th>'}</tr></thead>
          <tbody>${paginaVendas.map(v=>`<tr>${colunasAtivas.length?colunasAtivas.map(c=>`<td>${FMT_COL[c](v)}</td>`).join(''):'<td style="text-align:center;color:var(--muted)">Nenhuma coluna selecionada</td>'}</tr>`).join('')}</tbody>
        </table></div>
        ${paginacaoHTML}
      </div>`;
  }

  setHTML('relConteudo', personalizarHTML + kpisHTML + formaHTML + produtoHTML + detalheHTML);
}

function exportarRelatorio(){
  if(!temPermissao('relatorios','exportar')){toast('Sem permissão para exportar.','err');return;}
  if(!_relDados.length){toast('Gere um relatório primeiro.','err');return;}
  exportCSV(_relDados, val('relModulo')||'relatorio');
}

function atualizarColunas(){
  $('relTipoWrap').style.display = val('relModulo')==='financeiro' ? 'block' : 'none';
  setHTML('relTotais','');
  setHTML('relConteudo','<div style="text-align:center;padding:32px;color:var(--muted)">Clique em Gerar para carregar os dados.</div>');
}

function init(){
  if(!session)return;
  if(!guardModulo('relatorios'))return;
  $('userName').textContent=session.nome||'';
  $('userAvatar').textContent=initials(session.nome||'');
  const emp=session.empresa;
  if(emp){
    $('topbarSub').textContent=(emp.fantasia||emp.razao||'')+' · Relatórios';
    if(emp.trial_fim){const d=Math.ceil((new Date(emp.trial_fim)-new Date())/864e5);if(d>0){$('trialBadge').textContent='Teste grátis: '+d+' dias';$('trialBadge').style.display='inline-block';}}
  }
  // Set default dates (last 30 days)
  const ate=hoje();
  const de=new Date();de.setDate(de.getDate()-30);
  if($('relDe'))$('relDe').value=dataLocal(de);
  if($('relAte'))$('relAte').value=ate;

  // Quick access cards
  setHTML('relCards',[
    {ico:'🛒',lbl:'Vendas',mod:'vendas',grad:'linear-gradient(150deg,#34D399 0%,#059669 100%)'},
    {ico:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>',lbl:'Financeiro',mod:'financeiro',grad:'linear-gradient(150deg,#9B8CF0 0%,#8171E8 100%)'},
    {ico:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',lbl:'Clientes',mod:'clientes',grad:'linear-gradient(150deg,var(--p) 0%,var(--p2) 100%)'},
    {ico:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></svg>',lbl:'Ordens de Serviço',mod:'ordens_servico',grad:'linear-gradient(150deg,#5B21B6 0%,#3B1178 100%)'},
    {ico:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',lbl:'Materiais',mod:'materiais',grad:'linear-gradient(150deg,#C4B5FD 0%,#D2BCFF 100%)'},
  ].map(c=>`
    <div onclick="document.getElementById('relModulo').value='${c.mod}';atualizarColunas();gerarRelatorio()"
      style="background:${c.grad};border:none;border-radius:20px;padding:24px 20px;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease;text-align:center;box-shadow:0 10px 26px rgba(83,50,148,.25);color:#fff"
      onmouseover="this.style.transform='translateY(-2px)'"
      onmouseout="this.style.transform=''">
      <div style="width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;margin:0 auto 12px">${c.ico}</div>
      <div style="font-size:14px;font-weight:700;color:#fff">${c.lbl}</div>
      <div style="font-size:11px;color:rgba(255,255,255,.72);margin-top:4px">Clique para gerar</div>
    </div>`).join(''));
}

init();
</script>
<script>
// ── Sidebar dinâmica por segmento ──
(function(){
  try{
    const raw = sessionStorage.getItem('nuvix_v2_session');
    if(!raw) return;
    const d = JSON.parse(raw);
    const seg = (d.empresa?.segmento || d.empresa?.tipo || '').toLowerCase();
    const nav = document.getElementById('sidebar');
    if(!nav) return;

    // Ponto x RH — funcionário que só bate ponto (permissão "folha_ponto" liberada
    // e "rh" explicitamente negada) não deve ver "RH" no menu, só "Ponto". Mesma
    // regra "fail-open" do resto do sistema: sem linha de permissão pro módulo,
    // conta como liberado — então por padrão continua mostrando RH normalmente.
    const _perfil = d.user?.perfil;
    const _perms = d.user?.usuario_permissoes || [];
    const temPerm = (mod,tipo) => {
      if(_perfil==='Administrador'||_perfil==='SuperAdmin') return true;
      const p = _perms.find(x=>x.modulo===mod);
      return p ? !!p[`pode_${tipo}`] : true;
    };
    const soPonto = !temPerm('rh','ver') && temPerm('folha_ponto','ver');
    const linkPessoasRH = soPonto
      ? '<a class="sb-btn" href="rh.html" data-tip="Bater ponto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>Ponto</span></a>'
      : '<a class="sb-btn" href="rh.html" data-tip="RH e Colaboradores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg><span>RH</span></a>';

    const logo = nav.querySelector('.sidebar-logo');
    const configBtn = nav.querySelector('[href="parametros.html"]')?.closest('.sb-group');

    // Determine which groups to show
    const isTransporte = seg.includes('transporte');
    const isServico = seg.includes('serviço') || seg.includes('servico') || seg.includes('serviços') || seg.includes('prestação');
    const isVarejo = seg.includes('venda de produto');
    const isMista = seg.includes('mista');

    // Hide all dynamic groups (keep logo and config)
    nav.querySelectorAll('.sb-group').forEach(g => {
      if(!g.style.marginTop) g.style.display = 'none';
    });

    // Build groups based on segment
    let html = '';

    // PRINCIPAL - always
    html += `<div class="sb-group">
      <div class="sb-group-label">Principal</div>
      <a class="sb-btn" href="dashboard.html" data-tip="Painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Painel</span></a>
      <a class="sb-btn" href="financeiro.html" data-tip="Financeiro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>Financeiro</span></a>
      <a class="sb-btn" href="notas-fiscais.html" data-tip="Notas Fiscais"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/></svg><span>Notas Fiscais</span></a>
      <a class="sb-btn" href="crm.html" data-tip="Comercial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span>Comercial</span></a>
    </div>`;

    // SERVIÇOS
    if(isServico || isMista){
      html += `<div class="sb-group">
        <div class="sb-group-label">Serviços</div>
        <a class="sb-btn" href="os.html" data-tip="Ordens de Serviço"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg><span>Ordens de Serviço</span></a>
        <a class="sb-btn" href="servicos.html" data-tip="Serviços e Orçamentos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>Serviços</span></a>
        <a class="sb-btn" href="materiais.html" data-tip="Materiais e Estoque"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg><span>Materiais</span></a>
      </div>`;
    }

    // TRANSPORTE
    if(isTransporte || isMista){
      html += `<div class="sb-group">
        <div class="sb-group-label">Transporte</div>
        <a class="sb-btn" href="transporte.html" data-tip="Operações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg><span>Transporte</span></a>
        <a class="sb-btn" href="cotacao.html" data-tip="Cotação de Frete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span>Cotação</span></a>
      </div>`;
    }

    // VENDA DE PRODUTO — segmento isolado de propósito: não compartilha grupo com
    // Serviços nem Transporte (só se sobrepõe pra "Mista", que faz tudo por natureza).
    if(isVarejo || isMista){
      html += `<div class="sb-group">
        <div class="sb-group-label">Produtos</div>
        <a class="sb-btn" href="produtos.html" data-tip="Produtos e Estoque"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-2px;display:inline-block;flex-shrink:0"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg><span>Produtos</span></a>
        <a class="sb-btn" href="caixa.html" data-tip="Caixa (PDV)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-2px;display:inline-block;flex-shrink:0"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span>Caixa</span></a>
      </div>`;
    }

    // PESSOAS - always
    html += `<div class="sb-group">
      <div class="sb-group-label">Pessoas</div>
      <a class="sb-btn" href="app.html" data-tip="Clientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Clientes</span></a>
      ${linkPessoasRH}
    </div>`;

    // ANÁLISE - always
    html += `<div class="sb-group">
      <div class="sb-group-label">Análise</div>
      <a class="sb-btn" href="relatorios.html" data-tip="Relatórios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Relatórios</span></a>
    </div>`;

    // Insert after logo
    logo.insertAdjacentHTML('afterend', html);

    // Filtro por permissão do funcionário — some da sidebar o módulo que o
    // usuário logado não tem "pode_ver" liberado. Administrador/SuperAdmin
    // sempre vê tudo. Módulo sem permissão configurada ainda fica visível
    // (não trava ninguém por permissão que nunca foi definida).
    const HREF_MODULO={'dashboard.html':'dashboard','financeiro.html':'financeiro','crm.html':'crm','transporte.html':'transporte','cotacao.html':'cotacao','rh.html':['rh','folha_ponto'],'relatorios.html':'relatorios','parametros.html':'configuracoes','os.html':'ordens_servico','servicos.html':'servicos','materiais.html':'materiais','notas-fiscais.html':'notas_fiscais','produtos.html':'produtos','caixa.html':'caixa'};
    const permsUser = d.user?.usuario_permissoes || [];
    const isAdminUser = d.user?.perfil==='Administrador' || d.user?.perfil==='SuperAdmin';
    function podeVerModulo(modId){
      if(isAdminUser) return true;
      const ids = Array.isArray(modId)?modId:[modId];
      return ids.some(id=>{const p=permsUser.find(x=>x.modulo===id);return p?!!p.pode_ver:true;});
    }
    nav.querySelectorAll('.sb-btn').forEach(btn=>{
      const modId = HREF_MODULO[btn.getAttribute('href')];
      if(modId && !podeVerModulo(modId)) btn.remove();
    });
    nav.querySelectorAll('.sb-group').forEach(g=>{
      if(g.style.marginTop) return;
      if(!g.querySelector('.sb-btn')) g.remove();
    });

    // Mark active page
    const current = window.location.pathname.split('/').pop();
    nav.querySelectorAll('.sb-btn').forEach(btn => {
      if(btn.getAttribute('href') === current){
        btn.classList.add('active');
      }
    });

  }catch(e){ console.warn('Sidebar error:', e); }
})();
</script>
<script src="../js/token-refresh.js"></script>
<script src="../js/alerta-sidebar.js"></script>
</body>
</html>
